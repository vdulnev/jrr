name: Build & Release

on:
  push:
    tags:
      - '*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jrr_f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: jrr_f/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: jrr_f/build/app/outputs/bundle/release/app-release.aab

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jrr_f
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archive Release
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath JRiverRemote-Windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: jrr_f/JRiverRemote-Windows.zip

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: jrr_f
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --config-only
      - name: Build macOS (ad-hoc signed)
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace \
            -scheme Runner -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" \
            build
      - name: Archive Release
        run: |
          set -euo pipefail
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' | head -n1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build/macos/Build/Products/Release"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" "JRiverRemote.app"
          zip -ry JRiverRemote-macOS.zip JRiverRemote.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: jrr_f/JRiverRemote-macOS.zip

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: jrr_f
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r ../../../JRiverRemote-iOS.ipa Payload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: jrr_f/JRiverRemote-iOS.ipa

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jrr_f
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev libstdc++-12-dev pkg-config libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Archive Release
        run: |
          tar -czvf JRiverRemote-Linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: jrr_f/JRiverRemote-Linux.tar.gz

  release:
    needs: [build-android, build-windows, build-macos, build-ios, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify all artifacts present
        run: |
          set -e
          for f in \
            artifacts/android-apk/app-release.apk \
            artifacts/android-aab/app-release.aab \
            artifacts/windows/JRiverRemote-Windows.zip \
            artifacts/macos/JRiverRemote-macOS.zip \
            artifacts/ios/JRiverRemote-iOS.ipa \
            artifacts/linux/JRiverRemote-Linux.tar.gz; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/android-aab/app-release.aab
            artifacts/windows/JRiverRemote-Windows.zip
            artifacts/macos/JRiverRemote-macOS.zip
            artifacts/ios/JRiverRemote-iOS.ipa
            artifacts/linux/JRiverRemote-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
